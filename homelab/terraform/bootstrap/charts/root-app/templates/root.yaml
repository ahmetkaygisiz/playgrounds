apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-root
  namespace: {{ .Release.Namespace }}
spec:
  project: default
  source:
    repoURL: {{ required "repoURL gerekli" .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: k8s/root
    helm:
      valuesObject:
        repoURL: {{ .Values.repoURL | quote }}
        targetRevision: {{ .Values.targetRevision | quote }}
        domain: {{ .Values.domain | quote }}
        timezone: {{ .Values.timezone | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Release.Namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
