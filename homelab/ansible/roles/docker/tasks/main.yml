---
# Docker'ın kendi containerd'si /run/containerd kullanır; k3s ise gömülü
# containerd'yi /run/k3s/containerd altında çalıştırır. İkisi çakışmaz.
- name: Docker apt deposunu ekle
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"]
    signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    state: present

- name: Docker paketlerini kur
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Docker log boyutunu sınırla (SD kart için)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "local",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
    mode: "0644"
  notify: Restart docker

- name: Docker servisi açık
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Kullanıcıları docker grubuna ekle
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
