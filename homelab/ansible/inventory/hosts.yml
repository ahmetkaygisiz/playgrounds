# Evdeki cihazlar.
#
# static_ip : Ansible'ın Pi'ye NetworkManager (nmcli) ile atayacağı sabit IP
# dhcp_ip   : (opsiyonel) Pi'nin ŞU AN DHCP'den aldığı IP. Sadece ilk kurulumda,
#             Pi henüz static_ip'de değilse gerekir. Sabit IP atandıktan sonra
#             satırı silebilirsiniz. Router arayüzünden veya `ping pilabs01.local`
#             ile öğrenebilirsiniz.
#
# Varsayılan (SD kart dostu): 1 k3s server + 2 agent. Server SQLite kullanır.
# HA'ya geçmek için (SSD önerilir):
#   1) group_vars/all.yml içinde k3s_ha: true yapın
#   2) pilabs02 ve pilabs03'ü k3s_agent'tan k3s_server grubuna taşıyın
#      (etcd quorum için toplam 3 server gerekir)
all:
  vars:
    ansible_user: padawan            # Raspberry Pi Imager'da oluşturduğunuz kullanıcı
    ansible_host: "{{ static_ip | default(inventory_hostname) }}"   # localhost'ta static_ip yok
  children:
    k3s_cluster:
      children:
        k3s_server:
          hosts:
            pilabs01:                 # Pi 5 4GB
              static_ip: 192.168.50.250
              # dhcp_ip: 192.168.50.102
              node_role: control      # ArgoCD, Traefik
        k3s_agent:
          hosts:
            pilabs02:                 # Pi 5 8GB
              static_ip: 192.168.50.251
              # dhcp_ip: 192.168.50.101
              node_role: monitoring   # Prometheus, Grafana, Loki
            pilabs03:                 # Pi 5 8GB
              static_ip: 192.168.50.252
              # dhcp_ip: 192.168.50.109
              node_role: apps         # n8n + PostgreSQL
    floci:
      hosts:
        pilabs03: {}                  # Floci, k3s dışında Docker Compose ile çalışır
    vscode_tunnel:
      hosts:
        pilabs03: {}                  # VS Code Remote Tunnel + kubectl (README.vscode.md)
    pi_connect:
      hosts:
        pilabs01: {}                  # Raspberry Pi Connect: yedek uzaktan terminal
