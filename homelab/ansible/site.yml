---
# Boş Raspberry Pi'leri uçtan uca hazırlar:
#   ansible-playbook site.yml
# Sadece bir kısmı için:  --tags network | common | k3s | floci

- name: Sabit IP
  ansible.builtin.import_playbook: network.yml
  tags: [network]

- name: Ön kontroller
  hosts: all
  gather_facts: true
  tags: [always]
  tasks:
    - name: 64-bit işletim sistemi şart
      ansible.builtin.assert:
        that: ansible_facts['architecture'] in ['aarch64', 'x86_64']
        fail_msg: "64-bit OS gerekli (Raspberry Pi OS Lite 64-bit veya Ubuntu Server arm64)."

    - name: HA için 3 server gerekli
      ansible.builtin.assert:
        that: (groups['k3s_server'] | length) in [1, 3, 5]
        fail_msg: "k3s_server grubunda 1 (tekli) veya 3/5 (HA) node olmalı."
      run_once: true

- name: Ortak işletim sistemi ayarları
  hosts: all
  roles:
    - role: common
      tags: [common]

- name: İlk server (k3s)
  hosts: k3s_server[0]
  roles:
    - role: k3s
      k3s_mode: server
      tags: [k3s]

- name: Diğer server'lar (k3s, yalnızca HA)
  hosts: k3s_server[1:]
  serial: 1
  roles:
    - role: k3s
      k3s_mode: server
      tags: [k3s]

- name: Agent node'lar (k3s)
  hosts: k3s_agent
  roles:
    - role: k3s
      k3s_mode: agent
      tags: [k3s]

- name: Agent'ların cluster'a katılmasını bekle
  hosts: k3s_server[0]
  gather_facts: false
  tags: [k3s]
  tasks:
    - name: Node Ready mi
      ansible.builtin.command: >-
        k3s kubectl wait --for=condition=Ready node/{{ item }} --timeout=30s
      loop: "{{ groups['k3s_agent'] }}"
      register: k3s_agent_ready
      until: k3s_agent_ready.rc == 0
      retries: 20
      delay: 15
      changed_when: false

- name: Docker + Floci
  hosts: floci
  roles:
    - role: docker
      tags: [floci, docker]
    - role: floci
      tags: [floci]

- name: Özet
  hosts: localhost
  gather_facts: false
  become: false
  tags: [always]
  tasks:
    - name: Sonraki adım
      ansible.builtin.debug:
        msg:
          - "Kubeconfig: {{ hostvars[groups['k3s_server'][0]]['kubeconfig_local_path'] | default('kubeconfig') }}"
          - "Kontrol:   KUBECONFIG=../kubeconfig kubectl get nodes -L homelab/role"
          - "Sonra:     cd ../terraform/bootstrap && terraform init && terraform apply"
